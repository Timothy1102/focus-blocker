<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked – Focus Blocker</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true"><span></span></div>
      <h1><span id="site">This site</span> is blocked</h1>
      <p id="message"></p>
      <div class="actions">
        <button id="back" type="button">Go back</button>
      </div>
      <p class="hint">Need it? Open the Focus Blocker popup and switch this site off.</p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
